---
name: Build
on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: '1.21'

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: install Crystal dependencies
        run: shards install --frozen

      - name: build tasks
        run: shards build

      - name: test tasks
        run: crystal spec

      - name: restore cached downloads
        id: cache-download-restore
        uses: actions/cache/restore@v4
        with:
          path: downloads
          key: ${{ runner.os }}-downloads-${{ hashFiles('libs.yml') }}
          restore-keys: |
            ${{ runner.os }}-downloads-

      - name: fetch libraries and generate package
        run: bin/tasks package

      - name: archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-package
          path: pkg/libs-*.tar.xz
          retention-days: 5

      - name: save downloads in cache
        id: cache-download-sav
        uses: actions/cache/save@v4
        with:
          path: downloads
          key: ${{ steps.cache-download-restore.outputs.cache-primary-key }}
